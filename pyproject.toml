[project]
name = "tool-latency-bench"
version = "0.1.0"
description = "Measures the latency added by tool definitions in LLM requests"
requires-python = ">=3.12"
dependencies = [
  "click>=8.3",
  "httpx>=0.28",
  "tiktoken>=0.12",
  "python-dotenv",
  "loguru",
]

[project.scripts]
# Main CLI entry point: uv run tool-latency-bench <command>
tool-latency-bench = "tool_latency_bench.cli:main"

[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_latency_bench", "benchmarks"]
